# V4 H2 chemistry-sensitivity grid.
#
# Deterministic scenario grid, not a probability distribution.
# Required homogeneous ignition delay:
#
#   tau_required = residence_time_s * safety_factor
#
# phi is not interpolated. Every requested phi must exist in the
# generated ignition-delay table.

residence_time_s:
  - 0.0001
  - 0.0003
  - 0.001
  - 0.003
  - 0.01

phi:
  - 2.0
  - 4.0
  - 8.0
  - 16.0

safety_factor:
  - 1.0
  - 3.0
  - 10.0

heating_backend: brandis_johnston_2014
