version: v5b-1
name: structure-to-properties-holdout

model:
  type: feos
  model: gc_pcsaft_joback
  residual: Rehner2023 heterosegmented GC-PC-SAFT
  ideal_gas: Joback1987
  smarts: Sauer2014

entry:
  heating_backend: brandis_johnston_2014
  wall_to_fluid_approach_k: 25.0
  cooled_area_m2: 12.0

validation:
  temperatures_k: [293.15, 350.0, 400.0, 450.0, 500.0]
  pressures_pa: [25000.0, 101325.0, 300000.0]
  saturation_pressures_pa: [101325.0]

# Reference identities are used only after prediction artifacts have been
# written. They are not passed into the FeOS predictor.
holdouts:
  - id: ethanol
    smiles: CCO
    reference_coolprop_name: Ethanol
    storage_temperature_k: 293.15
    storage_pressure_pa: 101325.0
    max_exit_temperature_k: 500.0

  - id: acetone
    smiles: CC(=O)C
    reference_coolprop_name: Acetone
    storage_temperature_k: 293.15
    storage_pressure_pa: 101325.0
    max_exit_temperature_k: 500.0
