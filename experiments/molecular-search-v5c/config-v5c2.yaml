version: v5c-2
name: property-targeted-expanded-molecular-search

search:
  workers: 16
  require_v5c_ready: true
  require_in_domain_for_rankable: true
  allow_exploratory_domain_expansion: true
  full_entry_rankable_limit: 60
  full_entry_exploratory_limit: 12
  conservative_score_multiplier: 1.0
  maximum_candidates_after_dedup: 800

domain_expansion:
  rankable_families:
    - alkanes
    - alkenes
    - aromatics
    - cyclic_hydrocarbons
    - oxygenated
  exploratory_families:
    - aldehydes
    - alkynes
    - esters
    - amines

candidate_constraints:
  allowed_atomic_numbers: [6, 7, 8]
  require_neutral: true
  min_molecular_weight_g_mol: 40.0
  max_molecular_weight_g_mol: 220.0
  min_heavy_atoms: 3
  max_heavy_atoms: 14
  max_rings: 1

storage:
  temperature_k: 293.15
  pressure_pa: 101325.0
  require_liquid: true
  require_saturation_at_storage_pressure: true

cooling:
  max_exit_temperature_k: 500.0
  wall_to_fluid_approach_k: 25.0
  cooled_area_m2: 12.0

entry:
  heating_backend: brandis_johnston_2014

uncertainty:
  coverage_target: 0.90
  k_neighbors: 5
  similarity_floor: 0.05
  in_domain_similarity: 0.45
  edge_similarity: 0.25
  minimum_neighbors: 2

prescreen:
  temperature_grid_k: [350.0, 400.0, 450.0, 500.0]
  pressure_grid_pa: [25000.0, 101325.0, 300000.0, 1000000.0, 3000000.0, 10000000.0]
  latent_proxy_offset_k: 2.0
  minimum_positive_delta_h_fraction: 0.90
  minimum_enthalpy_ratio_vs_water: 0.25

generation:
  # Existing V5c-1 space, expanded modestly.
  alkanes:
    min_c: 3
    max_c: 12
  branched_alkanes:
    min_total_c: 5
    max_total_c: 12
  alkenes:
    min_c: 3
    max_c: 11
  primary_alcohols:
    min_c: 2
    max_c: 10
  ketones:
    min_c: 3
    max_c: 11
  ethers:
    min_total_c: 3
    max_total_c: 10
  alkyl_benzenes:
    min_sidechain_c: 1
    max_sidechain_c: 6
  cycloalkanes:
    # Pinned Sauer/Rehner parameters contain dedicated 5- and 6-member rings.
    min_ring: 5
    max_ring: 6
    methyl_substitution: true

  # New V5c-2 motifs explicitly present in pinned Sauer/Rehner/Joback groups.
  aldehydes:
    min_c: 2
    max_c: 10
  terminal_alkynes:
    min_c: 3
    max_c: 10
  esters:
    min_total_c: 2
    max_total_c: 10
    max_acyl_c: 6
  branched_primary_alcohols:
    min_total_c: 4
    max_total_c: 10

  # NH2 exists in the pinned group model, but nitrogen has no successful V5b
  # calibration liquids. These candidates are exploratory only until new
  # reference compounds are added to the uncertainty calibration set.
  primary_amines:
    min_c: 2
    max_c: 10
